[pytest]
asyncio_mode = auto
testpaths = tests

# 工程最佳实践：默认开启严格模式与汇总，CI 信号更干净。
# -ra                       : 运行结束汇总（passed/skipped/failed/xfail）概览
# --strict-markers          : 未注册 marker 直接报错，防笔误
# --strict-config           : 未知配置键直接报错
addopts = -ra --strict-markers --strict-config

# xfail 必须真的失败，否则视为测试回归（避免“假绿”）。
xfail_strict = true

# 自定义 marker 分类，便于按层运行：
#   pytest -m "not integration"  仅跑单测（最快反馈）
#   pytest -m integration        仅跑集成/端到端
markers =
    integration: 跨模块/端到端集成测试（默认慢，可 -m "not integration" 跳过）
    slow: 运行较慢的测试
    unit: 纯单元逻辑测试

# 过滤规则（注意：每条规则独占一行，# 仅可用于整行注释）
# 1) 第三方库的历史弃用告警，与本项目无关
# 2) aiosqlite 工作线程在 pytest-asyncio 关闭事件循环后回调触发的良性噪声：
#    连接已 daemon 化（见 conftest），不会挂起进程，且测试已显式断言行为；
#    仅抑制消息含 "Event loop is closed" 的那一类，其他线程异常仍会如实上报。
filterwarnings =
    ignore::DeprecationWarning
    ignore:Event loop is closed:pytest.PytestUnhandledThreadExceptionWarning
