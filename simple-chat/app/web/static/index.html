<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:; connect-src 'self'" />
<meta name="llm-model" content="" />
<meta name="auth-enabled" content="" />
<title>Simple Chat</title>
<!-- Markdown 渲染依赖：改为本地 vendor（断网可用 + SRI 完整性校验），不再依赖外部 CDN。
     XSS 防护三层（改动 2）：A. vendor 进仓库 + SRI；B. 上方 CSP meta；C. app.js 的
     escapeFallback 在 DOMPurify 加载失败时作最后正则兜底。 -->
<script src="/static/vendor/marked.min.js" defer
  integrity="sha384-9Md4MlJk24bo2Ifubp0FbKhuES4/iAwyTGMeWpBG4RoHGTKygpEGEpOYhEQxbfa9"
  crossorigin="anonymous"></script>
<script src="/static/vendor/purify.min.js" defer
  integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu"
  crossorigin="anonymous"></script>
<style>
  :root {
    /* 配色：浅色模式优先，CSS 变量驱动，主色 teal-700 #0f766e */
    --primary: #0f766e;          /* teal-700 */
    --primary-hover: #0d5d56;    /* teal-800 */
    --primary-soft: #ccfbf1;     /* teal-100 选中/弱底 */
    --on-primary: #ffffff;       /* 主色上文字 */
    --bg: #f8fafc;               /* slate-50 页面背景 */
    --surface: #ffffff;          /* 卡片/气泡背景 */
    --surface-alt: #f1f5f9;      /* sidebar 底 */
    --text: #0f172a;             /* slate-900 主文字 */
    --text-muted: #475569;       /* slate-600 次要文字 */
    --text-faint: #94a3b8;       /* slate-400 占位 */
    --border: #e2e8f0;           /* slate-200 */
    --border-strong: #cbd5e1;    /* slate-300 */
    --danger: #dc2626;           /* red-600 错误 */
    --danger-bg: #fef2f2;        /* red-50 错误条底 */
    --danger-border: #fecaca;    /* red-200 */
    --radius-bubble: 12px;
    --radius-control: 8px;
    --sidebar-w: 260px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    --ring: 0 0 0 3px rgba(15, 118, 110, 0.35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font: 15px/1.6 var(--font);
    color: var(--text);
    background: var(--bg);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* 可见焦点轮廓（无障碍） */
  :focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  #input:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }

  /* hidden 属性优先于 display 规则 */
  [hidden] { display: none !important; }

  button { font: inherit; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ───────────────── 侧边栏 ───────────────── */
  #sidebar {
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    background: var(--surface-alt);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #sidebar-head {
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .btn-new {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: var(--on-primary);
    border-radius: var(--radius-control);
    cursor: pointer;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background-color .18s ease, border-color .18s ease;
  }
  .btn-new:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-new svg { width: 16px; height: 16px; }

  #list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    min-height: 0;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 10px;
    border-radius: var(--radius-control);
    cursor: pointer;
    color: var(--text);
    transition: background-color .15s ease;
    outline: none;
  }
  .item:hover { background: rgba(15, 118, 110, 0.06); }
  .item.active { background: var(--primary-soft); color: var(--primary-hover); font-weight: 600; }
  .item .title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item .del {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    border-radius: 6px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .item:hover .del, .item.active .del { display: flex; }
  .item .del:hover { background: var(--danger-bg); color: var(--danger); }
  .item .del svg { width: 14px; height: 14px; pointer-events: none; }

  /* 空侧边栏 */
  .sidebar-empty {
    padding: 24px 14px;
    color: var(--text-faint);
    font-size: 13px;
    text-align: center;
    line-height: 1.7;
  }

  #sidebar-foot {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #model-name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
  }
  #model-name .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--primary);
    flex: 0 0 auto;
  }
  #model-name .label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #btn-clear {
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: color .15s ease, border-color .15s ease;
  }
  #btn-clear:hover { color: var(--danger); border-color: var(--danger); }

  /* ───────────────── 主区 ───────────────── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--bg);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 12px;
    scroll-behavior: smooth;
  }

  /* 消息气泡容器：居中限宽 */
  .stream {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: var(--radius-bubble);
    word-break: break-word;
    box-shadow: var(--shadow-sm);
    animation: bubble-in .18s ease-out;
  }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg { animation: none; }
    #messages { scroll-behavior: auto; }
  }

  .msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: var(--on-primary);
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  /* system 消息不展示 */
  .msg.system { display: none; }

  .msg .md { white-space: normal; }
  .msg .md p:first-child { margin-top: 0; }
  .msg .md p:last-child { margin-bottom: 0; }
  .msg .md ul, .msg .md ol { margin: 6px 0; padding-left: 22px; }
  .msg .md li { margin: 2px 0; }
  .msg .md a { color: var(--primary); text-decoration: underline; }
  .msg .md code:not(pre code) {
    background: var(--surface-alt);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: .9em;
  }
  .msg .md h1, .msg .md h2, .msg .md h3 { margin: 10px 0 6px; line-height: 1.3; }
  .msg .md h1 { font-size: 1.2em; }
  .msg .md h2 { font-size: 1.1em; }
  .msg .md h3 { font-size: 1em; }
  .msg .md blockquote {
    margin: 6px 0; padding: 2px 12px;
    border-left: 3px solid var(--border-strong);
    color: var(--text-muted);
  }

  /* 代码块：``` 渲染为 pre>code + 复制按钮 */
  .code-wrap { position: relative; margin: 10px 0; }
  .msg .md pre {
    margin: 0;
    background: #0f172a;
    color: #e2e8f0;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: .88em;
    line-height: 1.5;
  }
  .msg .md pre code { background: none; padding: 0; color: inherit; }
  .copy-btn {
    position: absolute;
    top: 6px; right: 6px;
    padding: 3px 8px;
    border: 1px solid rgba(226, 232, 240, .25);
    background: rgba(15, 23, 42, .6);
    color: #e2e8f0;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    opacity: 0;
    transition: opacity .15s ease, background-color .15s ease;
  }
  .code-wrap:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: rgba(15, 23, 42, .85); }
  .copy-btn.copied { background: var(--primary); border-color: var(--primary); }

  /* 流式占位：等待首个 token 时的轻量提示 */
  .msg.streaming .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 1.2em;
  }
  .msg.streaming .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint);
    animation: blink 1.2s infinite ease-in-out both;
  }
  .msg.streaming .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .msg.streaming .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .msg.streaming .typing-dots span { animation: none; opacity: .5; }
  }

  /* 错误条 */
  .err-bar {
    align-self: flex-start;
    max-width: 80%;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    padding: 8px 12px;
    border-radius: var(--radius-control);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    box-shadow: var(--shadow-sm);
  }
  .err-bar .retry {
    border: 1px solid var(--danger);
    background: transparent;
    color: var(--danger);
    padding: 3px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
  }
  .err-bar .retry:hover { background: var(--danger); color: #fff; }

  /* ───────────────── 空状态 ───────────────── */
  .empty-state {
    max-width: 560px;
    margin: 0 auto;
    padding: 8vh 20px 0;
    text-align: center;
  }
  .empty-state .brand {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--primary);
    color: var(--on-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    box-shadow: var(--shadow-md);
  }
  .empty-state .brand svg { width: 30px; height: 30px; }
  .empty-state h1 {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 700;
  }
  .empty-state p {
    margin: 0 0 26px;
    color: var(--text-muted);
  }
  .examples { display: flex; flex-direction: column; gap: 10px; }
  .example {
    text-align: left;
    padding: 14px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-control);
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
    color: var(--text);
  }
  .example:hover { border-color: var(--primary); background: var(--primary-soft); }
  .example .q { font-weight: 600; }
  .example .hint { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  .placeholder {
    text-align: center;
    color: var(--text-faint);
    padding: 12vh 20px;
    font-size: 15px;
  }

  /* ───────────────── 输入区 ───────────────── */
  #composer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 20px 16px;
  }
  .composer-inner {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-control);
    resize: none;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    min-height: 48px;
    max-height: 200px;
    line-height: 1.5;
    transition: border-color .15s ease;
  }
  #input::placeholder { color: var(--text-faint); }
  #input:focus { border-color: var(--primary); outline: none; box-shadow: var(--ring); }
  #input:disabled { background: var(--surface-alt); color: var(--text-faint); cursor: not-allowed; }

  #send, #stop {
    padding: 0 20px;
    height: 48px;
    min-width: 64px;
    border: none;
    border-radius: var(--radius-control);
    cursor: pointer;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background-color .15s ease;
  }
  #send { background: var(--primary); color: var(--on-primary); }
  #send:hover:not(:disabled) { background: var(--primary-hover); }
  #send:disabled { background: var(--border-strong); color: #fff; cursor: not-allowed; }
  #stop { background: var(--surface); color: var(--danger); border: 1px solid var(--danger); }
  #stop:hover { background: var(--danger); color: #fff; }
  #send svg, #stop svg { width: 16px; height: 16px; }

  .composer-hint {
    max-width: 780px;
    margin: 6px auto 0;
    font-size: 11px;
    color: var(--text-faint);
    text-align: right;
  }

  /* 浮动“↓ 新消息”按钮 */
  #scroll-btn {
    position: absolute;
    right: 24px;
    bottom: 96px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--primary);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-md);
    z-index: 5;
  }
  #scroll-btn.show { display: inline-flex; }
  #scroll-btn:hover { background: var(--primary-soft); }
  #scroll-btn .badge {
    position: absolute;
    top: -4px; right: -4px;
    min-width: 16px; height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    line-height: 16px;
    text-align: center;
    display: none;
  }
  #scroll-btn.has-badge .badge { display: block; }

  /* 主区是相对定位容器，承载浮动按钮 */
  #main { position: relative; }

  /* 移动端：≤640 收起侧边栏抽屉 */
  .sidebar-toggle { display: none; }
  @media (max-width: 640px) {
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: var(--shadow-md);
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-toggle {
      display: inline-flex;
      position: absolute;
      top: 14px; left: 14px;
      width: 36px; height: 36px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }
    .msg { max-width: 92%; }
    .empty-state { padding-top: 12vh; }
  }
  .scrim {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, .35);
    z-index: 15;
  }
  .scrim.show { display: block; }

  /* ───────────────── 登录 / 注册（v0.2 认证） ───────────────── */
  #auth-gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  #auth-gate.show { display: flex; }
  #auth-gate .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-bubble);
    box-shadow: var(--shadow-md);
    padding: 24px 22px;
  }
  #auth-gate h1 { margin: 0 0 4px; font-size: 20px; }
  #auth-gate .auth-sub { margin: 0 0 18px; color: var(--text-muted); font-size: 13px; }
  #auth-gate label { display: block; font-size: 13px; color: var(--text-muted); margin: 10px 0 4px; }
  #auth-gate input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-control);
    font: inherit;
    color: var(--text);
    background: var(--surface);
  }
  #auth-gate input:focus { border-color: var(--primary); outline: none; box-shadow: var(--ring); }
  #auth-gate .auth-submit {
    width: 100%;
    margin-top: 16px;
    padding: 11px 12px;
    border: none;
    border-radius: var(--radius-control);
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 600;
    cursor: pointer;
  }
  #auth-gate .auth-submit:hover:not(:disabled) { background: var(--primary-hover); }
  #auth-gate .auth-submit:disabled { background: var(--border-strong); cursor: not-allowed; }
  #auth-gate .auth-switch {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }
  #auth-gate .auth-switch button {
    border: none; background: none; color: var(--primary);
    cursor: pointer; font: inherit; text-decoration: underline; padding: 0 2px;
  }
  #auth-error {
    margin-top: 10px;
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
  }
  #user-chip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    max-width: 130px;
  }
  #user-chip.show { display: flex; }
  #user-chip .name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #btn-logout {
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  #btn-logout:hover { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
  <aside id="sidebar" aria-label="会话列表">
    <div id="sidebar-head">
      <button class="btn-new" id="btn-new" aria-label="新建对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        新建对话
      </button>
    </div>
    <nav id="list" aria-label="历史会话"></nav>
    <div id="sidebar-foot">
      <div id="model-name">
        <span class="dot" aria-hidden="true"></span>
        <span class="label" id="model-label">加载中…</span>
      </div>
      <div id="user-chip" aria-label="当前用户">
        <span class="name" id="user-name"></span>
        <button id="btn-logout" type="button" aria-label="退出登录">退出</button>
      </div>
      <button id="btn-clear" aria-label="清空所有会话">清空</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <main id="main">
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="打开会话列表" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
    </button>

    <section id="messages" aria-live="polite" aria-label="对话消息">
      <div class="stream" id="stream"></div>
    </section>

    <button id="scroll-btn" aria-label="滚动到最新消息">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="badge" id="scroll-badge" aria-hidden="true">1</span>
    </button>

    <footer id="composer">
      <div class="composer-inner">
        <label for="input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">消息输入</label>
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行" aria-label="消息输入"></textarea>
        <button id="send" aria-label="发送消息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          发送
        </button>
        <button id="stop" aria-label="停止生成" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          停止
        </button>
      </div>
      <div class="composer-hint" id="composer-hint">Enter 发送 · Shift+Enter 换行</div>
    </footer>
  </main>

  <div id="auth-gate" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <form class="auth-card" id="auth-form" autocomplete="on">
      <h1 id="auth-title">登录</h1>
      <p class="auth-sub" id="auth-sub">登录后查看你的会话</p>
      <label for="auth-username">用户名</label>
      <input id="auth-username" name="username" type="text" autocomplete="username"
             required minlength="3" maxlength="64" />
      <label for="auth-password">密码</label>
      <input id="auth-password" name="password" type="password" autocomplete="current-password"
             required minlength="8" maxlength="128" />
      <div id="auth-error" role="alert"></div>
      <button class="auth-submit" id="auth-submit" type="submit">登录</button>
      <div class="auth-switch">
        <span id="auth-switch-text">没有账号？</span>
        <button type="button" id="auth-switch-btn">注册</button>
      </div>
    </form>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
