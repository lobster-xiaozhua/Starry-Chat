# Simple Chat 反向代理配置（改动 6）。
#
# 关键点（SSE 友好 + 限流 + 请求体上限）：
# - proxy_buffering off / proxy_cache off：SSE 禁止缓冲，逐字推送（首 token 延迟 <500ms）。
# - proxy_http_version 1.1 + proxy_set_header Connection ''：保持长连接，禁用逐请求建连。
# - chunked_transfer_encoding on：允许分块传输。
# - gzip off：SSE 禁止 gzip（缓冲压缩会打碎 event 帧、增加首 token 延迟）。
# - client_max_body_size 1m：与应用 BodySizeLimitMiddleware(1MB) 对齐（双保险）。
# - limit_req：漏桶限流 rate=30r/s burst=50，健康检查豁免。
#   注意：应用层 RateLimitMiddleware 按 user_id+IP 限流（30 次/60s），本层是
#   IP 粒度的第一道闸，两者互补。
#
# 用法：server 块引入，或复制到 /etc/nginx/conf.d/simple-chat.conf。

limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=30r/s;

upstream simple_chat {
    server 127.0.0.1:8000;
    keepalive 32;          # 复用到 uvicorn 的连接，降低首 token 延迟
}

server {
    listen 80;
    server_name _;

    # 请求体上限：与应用 max_body_bytes(1MB) 对齐；chunked 请求同样受此限制
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # 健康检查：豁免限流（limit_req off），供 LB/探针高频探测
    location = /healthz {
        limit_req off;
        proxy_pass http://simple_chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /readyz {
        limit_req off;
        proxy_pass http://simple_chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # SSE 对话端点：禁缓冲 / 禁缓存 / 禁压缩，长连接透传
    location /api/chat {
        limit_req zone=chat_limit burst=50 nodelay;

        proxy_pass http://simple_chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # 清空 Connection，启用 keep-alive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 三禁：缓冲 / 缓存 / 压缩
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # 超时：读 300s（覆盖长回复），连 10s
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # 透传应用侧 SSE 头（X-Accel-Buffering: no 等）
        proxy_pass_header X-Accel-Buffering;
        add_header X-Accel-Buffering no always;
    }

    # 静态资源：本地 vendor（marked/purify）+ 前端，可加长缓存
    location /static/ {
        limit_req zone=chat_limit burst=50 nodelay;
        proxy_pass http://simple_chat;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 其余路径（会话 CRUD / 页面）
    location / {
        limit_req zone=chat_limit burst=50 nodelay;
        proxy_pass http://simple_chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
